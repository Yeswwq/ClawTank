[package]
name = "clawtank-core"
description = "ClawTank RDP protocol core (IronRDP) exposed to the Swift host via a C ABI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# Keep all IronRDP crates on the same upstream 0.14/0.12/0.11 revision.
ironrdp-server = { git = "https://github.com/Devolutions/IronRDP.git", rev = "475e5d534f0afa080e51b940caf3d7c1f9d6ec6c", version = "0.14.0", default-features = false, features = ["egfx", "nscodec"] }
ironrdp-cliprdr = { git = "https://github.com/Devolutions/IronRDP.git", rev = "475e5d534f0afa080e51b940caf3d7c1f9d6ec6c", version = "0.9.0" }
ironrdp-core = { git = "https://github.com/Devolutions/IronRDP.git", rev = "475e5d534f0afa080e51b940caf3d7c1f9d6ec6c", version = "0.3.1" }
ironrdp-connector = { git = "https://github.com/Devolutions/IronRDP.git", rev = "475e5d534f0afa080e51b940caf3d7c1f9d6ec6c", version = "0.12.0" }
ironrdp-displaycontrol = { git = "https://github.com/Devolutions/IronRDP.git", rev = "475e5d534f0afa080e51b940caf3d7c1f9d6ec6c", version = "0.10.0" }
ironrdp-dvc = { git = "https://github.com/Devolutions/IronRDP.git", rev = "475e5d534f0afa080e51b940caf3d7c1f9d6ec6c", version = "0.10.0" }
ironrdp-egfx = { git = "https://github.com/Devolutions/IronRDP.git", rev = "475e5d534f0afa080e51b940caf3d7c1f9d6ec6c", version = "0.5.0" }
ironrdp-graphics = { git = "https://github.com/Devolutions/IronRDP.git", rev = "475e5d534f0afa080e51b940caf3d7c1f9d6ec6c", version = "0.11.0" }
ironrdp-pdu = { git = "https://github.com/Devolutions/IronRDP.git", rev = "475e5d534f0afa080e51b940caf3d7c1f9d6ec6c", version = "0.11.0" }
ironrdp-rdpsnd = { git = "https://github.com/Devolutions/IronRDP.git", rev = "475e5d534f0afa080e51b940caf3d7c1f9d6ec6c", version = "0.11.0" }
ironrdp-svc = { git = "https://github.com/Devolutions/IronRDP.git", rev = "475e5d534f0afa080e51b940caf3d7c1f9d6ec6c", version = "0.10.0" }
async-trait = "0.1"
bytes = "1"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "crypto"] }
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"] }
x509-cert = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
anyhow = "1"
# Client side of the integration test (tests/connect.rs), from the same revision.
ironrdp-async = { git = "https://github.com/Devolutions/IronRDP.git", rev = "475e5d534f0afa080e51b940caf3d7c1f9d6ec6c", version = "0.12.0" }
ironrdp-connector = { git = "https://github.com/Devolutions/IronRDP.git", rev = "475e5d534f0afa080e51b940caf3d7c1f9d6ec6c", version = "0.12.0" }
ironrdp-rdpeudp = { git = "https://github.com/Devolutions/IronRDP.git", rev = "475e5d534f0afa080e51b940caf3d7c1f9d6ec6c", version = "0.1.0" }
ironrdp-rdpeudp-tokio = { git = "https://github.com/Devolutions/IronRDP.git", rev = "475e5d534f0afa080e51b940caf3d7c1f9d6ec6c", version = "0.2.0" }
ironrdp-session = { git = "https://github.com/Devolutions/IronRDP.git", rev = "475e5d534f0afa080e51b940caf3d7c1f9d6ec6c", version = "0.13.0" }
ironrdp-tls = { git = "https://github.com/Devolutions/IronRDP.git", rev = "475e5d534f0afa080e51b940caf3d7c1f9d6ec6c", version = "0.3.0" }
ironrdp-tokio = { git = "https://github.com/Devolutions/IronRDP.git", rev = "475e5d534f0afa080e51b940caf3d7c1f9d6ec6c", version = "0.12.0", features = ["reqwest"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }
