[package]
name = "ironrdp-acceptor"
version = "0.12.0"
readme = "README.md"
description = "State machines to drive an RDP connection acceptance sequence"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Devolutions/IronRDP"
repository = "https://github.com/Devolutions/IronRDP"
authors = ["Devolutions Inc. <infos@devolutions.net>", "Teleport <goteleport.com>"]
keywords = ["remote-desktop", "rdp"]
categories = ["network-programming"]

[lib]
doctest = false
test = true

[dependencies]
ironrdp-core = { git = "https://github.com/Devolutions/IronRDP.git", rev = "475e5d534f0afa080e51b940caf3d7c1f9d6ec6c", version = "0.3", features = ["alloc"] } # public
ironrdp-pdu = { git = "https://github.com/Devolutions/IronRDP.git", rev = "475e5d534f0afa080e51b940caf3d7c1f9d6ec6c", version = "0.11" } # public
ironrdp-svc = { git = "https://github.com/Devolutions/IronRDP.git", rev = "475e5d534f0afa080e51b940caf3d7c1f9d6ec6c", version = "0.10" } # public
ironrdp-connector = { git = "https://github.com/Devolutions/IronRDP.git", rev = "475e5d534f0afa080e51b940caf3d7c1f9d6ec6c", version = "0.12" } # public
ironrdp-async = { git = "https://github.com/Devolutions/IronRDP.git", rev = "475e5d534f0afa080e51b940caf3d7c1f9d6ec6c", version = "0.12" } # public
rand = "0.9"
async-trait = "0.1"
tracing = { version = "0.1", features = ["log"] }

[target."cfg(windows)".dependencies]
sha2 = "0.10"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Authentication_Identity", "Win32_Security_Credentials"] }
