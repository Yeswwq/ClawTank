[workspace]
resolver = "3"
members = ["clawtank-core", "clawtank-mcp", "vendor/ironrdp-server-0.14-diagnostics"]
default-members = ["clawtank-core", "clawtank-mcp"]
# Historical vendor snapshots are retained for reference, not built or linted.

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/clawtank/clawtank"
rust-version = "1.94"

# IronRDP 0.14 protocol stack from one upstream revision. The 0.14 server is
# available in the official repository before its crates.io publication; keeping
# every IronRDP crate on the same revision prevents duplicate incompatible types.
[workspace.metadata.ironrdp]
revision = "475e5d534f0afa080e51b940caf3d7c1f9d6ec6c"

[patch."https://github.com/Devolutions/IronRDP.git"]
ironrdp-acceptor = { path = "vendor/ironrdp-acceptor" }
ironrdp-server = { path = "vendor/ironrdp-server-0.14-diagnostics" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# Keep debug builds small: full debug info for our crate only, none for dependencies.
[profile.dev]
debug = "line-tables-only"
# Incremental caches grow without bound across edits; full rebuilds of our one crate are fast.
incremental = false

[profile.dev.package."*"]
debug = false
